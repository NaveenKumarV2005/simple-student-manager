name: Student Management System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
check:
  runs-on: ubuntu-latest

  steps:
    -name: Download repo code
    uses: actions/checkout@v4

    -name: setup Node.js
    uses: actions/step-node@v4
    with:
      node-version: 22

    -name: Check Js syntax
    run: node --check script.js

    -name: Run test
    run: node tests.js

